# catppuccin mocha theme
include mocha.conf

# font
font_size 17.0
font_family family="GeistMono Nerd Font"
bold_font auto
italic_font auto
bold_italic_font auto

# tmux style splits
enabled_layouts splits
map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current
map ctrl+a>c new_tab_with_cwd
map ctrl+a>x close_window
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab

# tmux style tab bar
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_dir           slanted
tab_title_template          "{index}: {title}"

# navigation with nvim integration
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

allow_remote_control yes
listen_on unix:@mykitty
